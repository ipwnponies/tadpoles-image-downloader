[project]
name = "tadpoles-image-downloader"
version = "0.1.0"
description = ""
authors = [
    {name = "John Nguyen",email = "ipwnponies@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp (>=3.11.10,<4.0.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "piexif (>=1.1.3,<2.0.0)",
    "filetype (>=1.2.0,<2.0.0)",
    "pendulum (>=3.1.0,<4.0.0)",
    "platformdirs (>=4.3.6,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # typer.Option() in function defaults is idiomatic Typer
    "UP047",  # PEP 695 type parameter syntax not yet supported by mypy
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pudb = "^2025.1"
ipython = "^9.5.0"
ruff = "^0.13.0"
typer = "^0.17.4"
mypy = "^1.0"
pre-commit = "^4.0"

[tool.poetry.scripts]
main = "tadpoles_image_downloader.process_queue:app"
